<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos de Limpeza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="estilo.css"> 
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="codigo.js"></script>
</head>

<body>

<div class="container shadow-lg">

    
    <div class="titulo">
        <img src="Controle de Estoqueee.png" alt="Logo Controle de Estoque" class="logo-titulo">
    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label class="form-label">
                <i class="bi bi-droplet-fill"></i>
                Nome do Produto
            </label>
            <input type="text" class="form-control" placeholder="Digite o nome do produto"id="nome_produto">
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">
                <i class="bi bi-upc-scan"></i>
                Código
            </label>
            <input type="text" class="form-control" placeholder="Ex.: LIM001"id="codigo">
        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label class="form-label">
                <i class="bi bi-boxes"></i>
                Estoque
            </label>
            <input type="number" class="form-control"id="estoque">
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">
                <i class="bi bi-tags-fill"></i>
                Categoria
            </label>
            <select class="form-select"id="categoria">
                <option selected>Selecione...</option>
                <option value="Detergente">Detergente</option>
                <option value="Desinfetante">Desinfetante</option>
                <option value="agua_sanitaria">Água Sanitária</option>
                <option value="alcool">Álcool</option>
                <option value="sabao">Sabão</option>
                <option value="multiuso">Multiuso</option>
            </select>
        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label class="form-label">
                <i class="bi bi-truck"></i>
                Fornecedor
            </label>
            <input type="text" class="form-control" placeholder="Digite o fornecedor"id="fornecedor">
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">
                <i class="bi bi-calendar-check"></i>
                Data de Validade
            </label>
            <input type="date" class="form-control"id="data">
        </div>

    </div>

    <div class="mb-4">
        <label class="form-label">
            <i class="bi bi-card-text"></i>
            Descrição
        </label>
        <textarea class="form-control" rows="5" placeholder="Digite uma descrição do produto"id="descricao"></textarea>
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-success me-2"id="btn-cadastrar">
            <i class="bi bi-check-circle-fill"></i>
            Cadastrar
        </button>

        <button type="reset" class="btn btn-warning me-2"id="btn-limpar">
            <i class="bi bi-arrow-clockwise"></i>
            Limpar
        </button>

        <button type="button" class="btn btn-danger"id="btn-cancelar">
            <i class="bi bi-x-circle-fill"></i>
            Cancelar
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
